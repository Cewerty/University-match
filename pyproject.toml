[project]
name = "university_meeting_bot"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<=3.14"
dependencies = [
    "aiogram>=3.22.0",
    "aiogram-dialog>=2.4.0",
    "rich>=14.2.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "fastapi[all]>=0.121.3",
    "sqladmin>=0.21.0",
    "aiosqlite>=0.21.0",
    "sentence-transformers>=5.1.2",
    "faiss-cpu>=1.13.0",
    "numpy>=2.3.5",
    "alembic>=1.17.2",
    "mypy>=1.18.2",
    "loguru>=0.7.3",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "hello.py",
    "docs"
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C90",
    "PL",
    "RUF",
    "TRY",
    "ANN",
    "S",
    "B",
    "D",
    "N",
    "PL"
]
fixable = ["ALL"]
unfixable = []
ignore = ["PLR6301", "TRY003", "D212", "D211", "RUF002", "D203", "PLC0414", "ANN401", "RUF029", "RUF001", "RUF003"]
exclude = ['test_*', '__init__.py']

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["D400", "D415"]
"./seed.py" = ["S311"]

[tool.ruff.format]
docstring-code-format = true

[tool.alembic]
script_location = "alembic"
sqlalchemy.url = "sqlite+aiosqlite:///./test.db"

[tool.uv]
dev-dependencies = [
    "aioresponses>=0.7.8",
    "faker>=38.2.0",
    "pytest-asyncio>=1.3.0",
    "pytest>=9.0.1",
]
