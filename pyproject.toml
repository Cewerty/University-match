[project]
name = "university-match"
version = "0.2.3"
description = "Telegram bot that matches university students by shared interests using sentence embeddings and FAISS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<=3.14"
dependencies = [
    "aiogram>=3.22.0",
    "aiogram-dialog>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "fastapi[all]>=0.121.3",
    "sqladmin>=0.21.0",
    "aiosqlite>=0.21.0",
    "sentence-transformers>=5.1.2",
    # Direct dependency only so that [tool.uv.sources] below can pick the CPU build
    "torch>=2.10.0",
    "faiss-cpu>=1.13.0",
    "numpy>=2.3.5",
    "alembic>=1.17.2",
    "loguru>=0.7.3",
    "aiohttp-socks>=0.11.0",
    "faker>=38.2.0",
    "redis>=5.0",
    "aiohttp>=3.14.5",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "hello.py",
    "docs"
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
    "C90",
    "PL",
    "RUF",
    "TRY",
    "ANN",
    "S",
    "D",
    "N",
]
fixable = ["ALL"]
unfixable = []
ignore = ["PLR6301", "TRY003", "D212", "D211", "RUF002", "D203", "PLC0414", "ANN401", "RUF029", "RUF001", "RUF003"]
exclude = ['test_*', '__init__.py']

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["D400", "D415"]
"./seed.py" = ["S311"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "main.py", "seed.py", "alembic"]
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true

# Libraries without type information
[[tool.mypy.overrides]]
module = ["faiss", "faiss.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
# Current coverage is about 71%; the threshold guards against a drop, raise it as tests are added
fail_under = 67
show_missing = true
skip_empty = true

[tool.alembic]
script_location = "alembic"

[tool.commitizen]
# Only used to lint commit messages (pre-commit commit-msg hook).
# Versions, tags and CHANGELOG are managed by python-semantic-release.
name = "cz_conventional_commits"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"
tag_format = "v{version}"
allow_zero_version = true
# While on 0.x, a breaking change bumps minor (0.2 -> 0.3); going to 1.0 is a manual decision
major_on_zero = false
# The release bumps project.version in pyproject.toml; refresh uv.lock in the same
# release commit, otherwise `uv lock --check` in CI fails after every release
build_command = "uv lock && git add uv.lock"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore", "^ci", "^docs", "^style", "^test", "^build"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = true

# The bot runs on CPU. On Linux (CI, Docker) take PyTorch from the CPU-only index:
# the default PyPI build pulls several gigabytes of CUDA libraries. Windows and macOS
# builds on PyPI are CPU-only already, so they are left as they are.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=1.18.2",
    "pre-commit>=4.7",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.0.1",
    "pyyaml>=6.0.3",
    "ruff>=0.14.5,<0.15",
]

[tool.deptry]
known_first_party = ["src"]

[tool.deptry.per_rule_ignores]
# Declared but never imported, on purpose:
#   torch          only so that [tool.uv.sources] takes the CPU build (sentence-transformers imports it)
#   redis          backend of aiogram's RedisStorage (main.py creates it from REDIS_URL)
#   aiosqlite      SQLAlchemy driver, chosen by the sqlite+aiosqlite:// URL
#   aiohttp-socks  aiogram's AiohttpSession uses it for TELEGRAM_PROXY_URL
DEP002 = ["torch", "redis", "aiosqlite", "aiohttp-socks"]
# scripts/ci/check_compose_policy.py imports PyYAML only for YAML input in tests; CI passes JSON
DEP004 = ["yaml"]
