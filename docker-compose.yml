version: '3.8'

services:
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    image: university-meeting-bot:latest
    container_name: university-bot
    environment:
      - ENVIRONMENT=production
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bot.db
      - WEBHOOK_URL=${WEBHOOK_URL}
      - BACKEND_URL=http://web:8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    mem_limit: 512m
    cpu_shares: 512
    depends_on:
      - web
      - redis

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    image: university-meeting-bot:latest
    container_name: university-web
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bot.db
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped
    mem_limit: 512m
    cpu_shares: 512
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: university-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped
    mem_limit: 128m
    cpu_shares: 256

  nginx:
    image: nginx:alpine
    container_name: university-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
      - ./ssl:/etc/nginx/ssl
    restart: unless-stopped
    depends_on:
      - web
    mem_limit: 64m
    cpu_shares: 128

volumes:
  redis-data:
    driver: local