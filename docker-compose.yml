services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: university-match:latest
    container_name: university-match
    env_file: .env
    environment:
      # Bot and FastAPI run in the same container (see main.py)
      - WEB_HOST=0.0.0.0
      - BACKEND_URL=http://localhost:8000
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bot.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      # Embedding model cache (~460 MB), so it is not downloaded on every container recreate
      - hf-cache:/home/appuser/.cache/huggingface
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: university-match-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  hf-cache:
