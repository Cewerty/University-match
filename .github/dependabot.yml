version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release: most compromised or broken versions are pulled by then
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      # Conventional Commits: "build(deps)" does not trigger a release
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release: most compromised or broken versions are pulled by then
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # Base image digests in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release: most compromised or broken versions are pulled by then
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope

  # Image digests in compose.yaml (redis)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release: most compromised or broken versions are pulled by then
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
