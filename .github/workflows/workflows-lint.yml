name: Workflows lint

# Reusable workflow: called first by ci.yml, every other job waits for it.
# actionlint checks syntax, expressions and the shell in `run:` (with shellcheck, preinstalled
# on the runner); zizmor checks security: injections, permissions, unpinned actions.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    env:
      # Enables zizmor's online audits (impostor commits, known-vulnerable actions)
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.16"

      - uses: ./.github/actions/setup-just

      - name: Lint the workflows
        run: just workflows-lint
