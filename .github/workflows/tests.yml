name: Tests

# Reusable workflow: called by ci.yml
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Tests use a fake embedding model; fail loudly if anything tries to download one
      HF_HUB_OFFLINE: "1"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.16"
          enable-cache: true

      - uses: ./.github/actions/setup-just

      - name: Install dependencies
        run: just sync

      - name: Check migrations match the models
        run: just migrations-check

      # Fails if coverage drops below fail_under in pyproject.toml
      - name: Run tests with coverage
        run: just cov

      - name: Coverage summary
        if: always()
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          just coverage-summary >> "$GITHUB_STEP_SUMMARY" || true
