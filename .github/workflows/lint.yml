name: Lint

# Reusable workflow: called by ci.yml
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest
    env:
      # `uv run` in the recipes must not re-sync the environment installed below
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.16"
          enable-cache: true

      - uses: ./.github/actions/setup-just

      # Only the dev group (ruff, pytest): no torch/faiss needed to lint
      - name: Install dev tools
        run: just sync-dev

      # Fails if pyproject.toml was changed without updating uv.lock
      - name: Check the lock file is up to date
        run: just lock-check

      - name: Lint
        run: just lint --output-format=github

      - name: Check formatting
        run: just fmt-check

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.16"
          enable-cache: true

      - uses: ./.github/actions/setup-just

      # Full install: mypy reads the type information of aiogram, SQLAlchemy and the other dependencies
      - name: Install dependencies
        run: just sync

      - name: Type check
        run: just typecheck
