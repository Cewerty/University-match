name: Rescan released images

# New CVEs are published for images that were clean when they were built. Rescan the
# latest released images every week; findings go to Security -> Code scanning (one
# category per release), and the run fails on CRITICAL/HIGH vulnerabilities that have
# a fix, so GitHub emails the owner.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rescan
  cancel-in-progress: false

env:
  # Keep in sync with TRIVY_IMAGE in ci.yml
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  images:
    name: find released images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.find.outputs.image }}
      tags: ${{ steps.find.outputs.tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release tags older than image publishing have no image: keep the newest three that do
      - name: Find the newest released images
        id: find
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/university-match"
          tags=()
          for tag in $(git tag --list 'v*' --sort=-v:refname); do
            if docker manifest inspect "$image:$tag" > /dev/null 2>&1; then
              tags+=("$tag")
              [ "${#tags[@]}" -ge 3 ] && break
            fi
          done
          json=$(printf '%s\n' "${tags[@]}" | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Images to scan: $json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$json" >> "$GITHUB_OUTPUT"

  scan:
    name: scan ${{ matrix.tag }}
    needs: images
    if: needs.images.outputs.tags != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.images.outputs.tags) }}
    env:
      REF: ${{ needs.images.outputs.image }}:${{ matrix.tag }}
      # Trivy pulls from ghcr.io itself
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The current .trivyignore.yaml applies to old releases too
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Scan
        run: |
          trivy() {
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/repo" -v trivy-cache:/root/.cache \
              "$TRIVY_IMAGE" image --image-src remote --scanners vuln --ignorefile /repo/.trivyignore.yaml "$@" "$REF"
          }
          trivy --format sarif --output /repo/trivy.sarif
          trivy --skip-db-update --format table --output /repo/trivy.txt
          {
            echo "### $REF"
            echo '```'
            head -c 500000 trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: image-${{ matrix.tag }}

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        run: >
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$PWD:/repo" -v trivy-cache:/root/.cache
          "$TRIVY_IMAGE" image --image-src remote --scanners vuln --ignorefile /repo/.trivyignore.yaml
          --skip-db-update --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$REF"
