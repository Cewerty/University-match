name: Config lint

# Reusable workflow: ci.yml calls it once per tool, so each group of jobs waits only for
# the check of the configuration it depends on:
#   lint-dockerfile    (hadolint)            before the docker and podman jobs
#   yamllint                                 before the jobs that read compose and workflow YAML
#   validate-pyproject (pyproject.toml schema) before the Python jobs
on:
  workflow_call:
    inputs:
      tool:
        description: "just recipe: lint-dockerfile, yamllint or validate-pyproject"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: ${{ inputs.tool }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.9.16"

      - uses: ./.github/actions/setup-just

      - name: Lint
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          case "$TOOL" in
            lint-dockerfile|yamllint|validate-pyproject) just "$TOOL" ;;
            *) echo "unknown tool: $TOOL" >&2; exit 1 ;;
          esac
