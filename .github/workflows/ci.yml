name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: a cancelled release job could stop between the tag and the GitHub Release
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  docker:
    name: docker
    runs-on: ubuntu-latest
    env:
      # Well-formed but fake: the image is only started far enough to import the app
      BOT_TOKEN: "123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      IMAGE: university-match:ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap, always runs: compose reads env_file, so it needs a .env to exist
      - name: Validate the compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      # The image is heavy (torch), so build it only when something that goes into it changed
      - name: Detect changes that affect the image
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- Dockerfile .dockerignore docker-compose.yml pyproject.toml uv.lock | grep -q .; then
            echo "Image inputs changed: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that goes into the image changed: skipping the build." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the image
        if: steps.changes.outputs.build == 'true'
        run: docker build --tag "$IMAGE" .

      - name: Smoke test, the application imports
        if: steps.changes.outputs.build == 'true'
        run: docker run --rm -e BOT_TOKEN "$IMAGE" .venv/bin/python -c "import main"

      - name: Smoke test, migrations apply
        if: steps.changes.outputs.build == 'true'
        run: >
          docker run --rm -e BOT_TOKEN -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db
          "$IMAGE" .venv/bin/alembic upgrade head

  # Runs only on main and only after every check above has passed
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tests, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # all commits and tags are needed to compute the next version

      - name: Skip if main moved past the checked commit
        id: guard
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]; then
            echo "main is ahead of the checked commit $CHECKED_SHA; the newer push will be released." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          version: "0.9.16"

      - name: Validate release history
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/ci/validate_release_history.py

      # No release is created if there are no feat/fix/perf commits since the last tag
      - name: Version, changelog, tag and GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
          uvx --from python-semantic-release==10.7.0 semantic-release -v publish
