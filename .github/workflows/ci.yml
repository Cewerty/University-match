name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: a cancelled release job could stop between the tag and the GitHub Release
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  # The image is heavy (torch), so it is built only when something that goes into it changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes that affect the image
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- Dockerfile .dockerignore .trivyignore.yaml compose.yaml compose.override.yaml main.py pyproject.toml uv.lock .github/workflows/ci.yml | grep -q .; then
            echo "Image inputs changed: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing that goes into the image changed: skipping the image build and checks." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: docker
    needs: changes
    runs-on: ubuntu-latest
    env:
      # Well-formed but fake: the image is only started far enough to import the app
      BOT_TOKEN: "123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      IMAGE: university-match:ci
      # The restrictions compose.yaml applies to every service
      HARDENED: --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
      # Pinned by digest, like the other tool images; the same version is used in rescan.yml
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < Dockerfile

      # Cheap, always runs: compose reads env_file and the secret file, so both must exist
      - name: Validate the compose files
        run: |
          cp .env.example .env
          mkdir -p secrets && printf '%s' "$BOT_TOKEN" > secrets/bot_token
          docker compose config --format json > "$RUNNER_TEMP/compose.dev.json"                # with the override
          docker compose -f compose.yaml config --format json > "$RUNNER_TEMP/compose.prod.json"  # production
          python3 scripts/ci/check_compose_policy.py "$RUNNER_TEMP/compose.prod.json" "$RUNNER_TEMP/compose.dev.json"

      # seccomp and AppArmor must be active on the host for the default profiles to apply
      - name: Report the Docker host security options
        run: |
          echo "Docker security options: $(docker info --format '{{json .SecurityOptions}}')" | tee -a "$GITHUB_STEP_SUMMARY"
          docker info --format '{{json .SecurityOptions}}' | grep -q seccomp

      - name: Build the image
        id: build
        if: needs.changes.outputs.build == 'true'
        run: |
          start=$(date +%s)
          docker build --tag "$IMAGE" .
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Report image size and build time
        if: needs.changes.outputs.build == 'true'
        env:
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: |
          size=$(docker image inspect --format '{{.Size}}' "$IMAGE")
          {
            echo "### Docker image"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Size | $(( size / 1024 / 1024 )) MiB |"
            echo "| Build time | ${BUILD_SECONDS} s |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Same restrictions as compose.yaml: catches writes outside /tmp and the volumes
      # and anything that needs a capability. No BOT_TOKEN: only the bot may need it.
      - name: Smoke test, the application imports under the compose restrictions
        if: needs.changes.outputs.build == 'true'
        run: docker run --rm $HARDENED "$IMAGE" python -c "import main, src.web.app"

      - name: Smoke test, the bot refuses to start without a token
        if: needs.changes.outputs.build == 'true'
        run: |
          if out=$(docker run --rm $HARDENED "$IMAGE" python main.py bot 2>&1); then
            echo "the bot started without a token"; exit 1
          fi
          echo "$out" | grep -q "BOT_TOKEN is not set"

      - name: Smoke test, PyTorch is the CPU build
        if: needs.changes.outputs.build == 'true'
        run: >
          docker run --rm "$IMAGE" python -c
          "import torch; assert not torch.cuda.is_available(); assert torch.__version__.endswith('+cpu'), torch.__version__; print(torch.__version__)"

      - name: Smoke test, runs as uid 10001 that can write its data and nothing else
        if: needs.changes.outputs.build == 'true'
        run: >
          docker run --rm "$IMAGE" sh -c
          'test "$(id -u)" = 10001
          && touch /app/data/probe /cache/huggingface/probe
          && ! touch /app/probe 2>/dev/null
          && ! touch /app/main.py 2>/dev/null
          && echo "uid $(id -u): data and model cache writable, code read-only"'

      # Seccomp 2 = filter mode (the default profile is applied), no capabilities, no privilege gain
      - name: Smoke test, the default seccomp profile applies and no capabilities are left
        if: needs.changes.outputs.build == 'true'
        run: >
          docker run --rm $HARDENED "$IMAGE" sh -c
          'grep -E "^(Seccomp|NoNewPrivs|CapEff):" /proc/self/status
          && grep -Eq "^Seccomp:[[:space:]]+2$" /proc/self/status
          && grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status
          && grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status'

      # A fresh named volume, as in compose: it must take its ownership from the image
      - name: Smoke test, migrations apply to a named volume on a read-only root
        if: needs.changes.outputs.build == 'true'
        run: docker run --rm $HARDENED -v ci-app-data:/app/data "$IMAGE" alembic upgrade head

      - name: No secrets in the image
        if: needs.changes.outputs.build == 'true'
        run: |
          docker run --rm "$IMAGE" sh -c 'test ! -e /app/.env && test ! -e /app/secrets'
          if docker history --no-trunc --format '{{.CreatedBy}}' "$IMAGE" | grep -Ei '(token|password|secret)[A-Z_]*='; then
            echo "a layer sets a secret-looking variable"; exit 1
          fi

      # The full report goes to the job summary; the job fails only on CRITICAL/HIGH
      # vulnerabilities that already have a fixed version (accepted ones: .trivyignore.yaml)
      - name: Scan the image for vulnerabilities
        if: needs.changes.outputs.build == 'true'
        run: |
          docker save "$IMAGE" -o "$RUNNER_TEMP/image.tar"
          trivy() {
            docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/.trivyignore.yaml:/trivyignore.yaml:ro" \
              -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image --input /scan/image.tar --scanners vuln \
              --ignorefile /trivyignore.yaml "$@"
          }
          trivy --format table --output /scan/trivy.txt
          {
            echo "### Vulnerabilities (all severities)"
            echo '```'
            head -c 500000 "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trivy --skip-db-update --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --format table
          rm -f "$RUNNER_TEMP/image.tar"

      # compose.override.yaml builds the dev target; it reuses the builder layers above
      - name: Build the dev target
        if: needs.changes.outputs.build == 'true'
        run: |
          docker build --target dev --tag university-match:dev .
          docker run --rm university-match:dev sh -c 'ruff --version && mypy --version'

  # The same image on a host without a root daemon: rootless Podman maps uid 10001 in
  # the container to an unprivileged subordinate uid of the runner user
  podman:
    name: podman (rootless)
    needs: changes
    runs-on: ubuntu-latest
    env:
      IMAGE: localhost/university-match:podman
      HARDENED: --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.build == 'true'

      - name: Podman runs rootless
        if: needs.changes.outputs.build == 'true'
        run: |
          podman version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          # Resolve short image names (python:..., redis:...) on Docker Hub, as Docker does
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$RUNNER_TEMP/registries.conf"
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"

      - name: Build the image
        if: needs.changes.outputs.build == 'true'
        run: podman build --target runtime --tag "$IMAGE" .

      - name: Smoke test, the application imports under the compose restrictions
        if: needs.changes.outputs.build == 'true'
        run: podman run --rm $HARDENED "$IMAGE" python -c "import main, src.web.app"

      - name: Smoke test, uid 10001 in the container, not root on the host
        if: needs.changes.outputs.build == 'true'
        run: |
          podman run --rm "$IMAGE" sh -c 'test "$(id -u)" = 10001 && touch /app/data/probe && ! touch /app/probe 2>/dev/null'
          podman run -d --name probe $HARDENED "$IMAGE" python -c "import time; time.sleep(60)"
          podman top probe user huser
          test "$(podman top probe huser | tail -n 1)" != root
          podman rm -f probe

      - name: Smoke test, migrations apply to a named volume
        if: needs.changes.outputs.build == 'true'
        run: podman run --rm $HARDENED -v ci-app-data:/app/data "$IMAGE" alembic upgrade head

  # Runs only on main and only after every check above has passed
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tests, docker, podman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The vX.Y.Z tag created by this run, empty when nothing was released
      tag: ${{ steps.tag.outputs.tag }}
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # all commits and tags are needed to compute the next version

      - name: Skip if main moved past the checked commit
        id: guard
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]; then
            echo "main is ahead of the checked commit $CHECKED_SHA; the newer push will be released." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          version: "0.9.16"

      - name: Validate release history
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/ci/validate_release_history.py

      # No release is created if there are no feat/fix/perf commits since the last tag
      - name: Version, changelog, tag and GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
          uvx --from python-semantic-release==10.7.0 semantic-release -v publish

      - name: Find the released tag
        id: tag
        if: steps.guard.outputs.skip != 'true'
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -1)" >> "$GITHUB_OUTPUT"

  # A separate job: a tag pushed with GITHUB_TOKEN does not start other workflows
  publish-image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write      # append the image digest to the GitHub Release notes
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/university-match" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.release.outputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          # SBOM and full build provenance are attached to the image in the registry
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ref="$IMAGE@$DIGEST"
          echo "Published \`$ref\` ($TAG)" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          printf '\n### Docker image\n\n```bash\ndocker pull %s\n```\n\nVerify: `gh attestation verify oci://%s --owner %s`\n' \
            "$ref" "$ref" "$OWNER" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
