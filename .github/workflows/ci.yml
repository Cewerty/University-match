name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: a cancelled release job could stop between the tag and the GitHub Release
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # First and required: a broken or unsafe workflow must not run anything else
  workflows-lint:
    uses: ./.github/workflows/workflows-lint.yml

  # Each configuration is checked before the jobs that depend on it
  hadolint:
    needs: workflows-lint
    uses: ./.github/workflows/config-lint.yml
    with:
      tool: lint-dockerfile

  yamllint:
    needs: workflows-lint
    uses: ./.github/workflows/config-lint.yml
    with:
      tool: yamllint

  pyproject:
    needs: workflows-lint
    uses: ./.github/workflows/config-lint.yml
    with:
      tool: validate-pyproject

  lint:
    needs: [workflows-lint, pyproject]
    uses: ./.github/workflows/lint.yml

  tests:
    needs: [workflows-lint, pyproject]
    uses: ./.github/workflows/tests.yml

  # The image is heavy (torch), so it is built only when something that goes into it changed
  changes:
    needs: [workflows-lint, yamllint]
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changes that affect the image
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          inputs=(Dockerfile .dockerignore .trivyignore.yaml justfile compose.yaml compose.override.yaml
                  main.py pyproject.toml uv.lock .github/workflows/ci.yml)
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- "${inputs[@]}" | grep -q .; then
            echo "Image inputs changed: building the image."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image inputs unchanged: skipping the image build and checks." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: docker
    needs: [changes, hadolint, yamllint]
    runs-on: ubuntu-latest
    env:
      # Well-formed but fake: the image is only started far enough to import the app.
      # `just secret-init` writes it to secrets/bot_token for `docker compose config`.
      BOT_TOKEN: "123456:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-just

      # Cheap, always runs: both compose configurations against the security policy
      - name: Validate the compose files
        run: just compose-policy

      # seccomp and AppArmor must be active on the host for the default profiles to apply
      - name: Report the Docker host security options
        run: just host-security

      - name: Build the image
        id: build
        if: needs.changes.outputs.build == 'true'
        run: |
          start=$(date +%s)
          just build
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Report image size and build time
        if: needs.changes.outputs.build == 'true'
        env:
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: |
          size=$(docker image inspect --format '{{.Size}}' "$(just --evaluate image)")
          {
            echo "### Docker image"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Size | $(( size / 1024 / 1024 )) MiB |"
            echo "| Build time | ${BUILD_SECONDS} s |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Same restrictions as compose.yaml: catches writes outside /tmp and the volumes
      # and anything that needs a capability. No BOT_TOKEN: only the bot may need it.
      - name: Smoke test, the application imports under the compose restrictions
        if: needs.changes.outputs.build == 'true'
        run: just smoke-import

      - name: Smoke test, the bot refuses to start without a token
        if: needs.changes.outputs.build == 'true'
        run: just smoke-no-token

      - name: Smoke test, PyTorch is the CPU build
        if: needs.changes.outputs.build == 'true'
        run: just smoke-torch-cpu

      - name: Smoke test, runs as uid 10001 that can write its data and nothing else
        if: needs.changes.outputs.build == 'true'
        run: just smoke-user

      # Seccomp 2 = filter mode (the default profile is applied), no capabilities, no privilege gain
      - name: Smoke test, the default seccomp profile applies and no capabilities are left
        if: needs.changes.outputs.build == 'true'
        run: just smoke-seccomp

      # A fresh named volume, as in compose: it must take its ownership from the image
      - name: Smoke test, migrations apply to a named volume on a read-only root
        if: needs.changes.outputs.build == 'true'
        run: just smoke-migrate

      - name: No secrets in the image
        if: needs.changes.outputs.build == 'true'
        run: just smoke-no-secrets

      # The full report goes to the job summary; the job fails only on CRITICAL/HIGH
      # vulnerabilities that already have a fixed version (accepted ones: .trivyignore.yaml)
      - name: Scan the image for vulnerabilities
        if: needs.changes.outputs.build == 'true'
        run: just scan

      # compose.override.yaml builds the dev target; it reuses the builder layers above
      - name: Build the dev target
        if: needs.changes.outputs.build == 'true'
        run: just build-dev

  # The same image on a host without a root daemon: rootless Podman maps uid 10001 in
  # the container to an unprivileged subordinate uid of the runner user
  podman:
    name: podman (rootless)
    needs: [changes, hadolint]
    runs-on: ubuntu-latest
    env:
      # The recipes of the docker job, run with Podman
      ENGINE: podman
      IMAGE: localhost/university-match:podman
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
        if: needs.changes.outputs.build == 'true'

      - uses: ./.github/actions/setup-just
        if: needs.changes.outputs.build == 'true'

      - name: Podman runs rootless
        if: needs.changes.outputs.build == 'true'
        run: |
          podman version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          # Resolve short image names (python:..., redis:...) on Docker Hub, as Docker does
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$RUNNER_TEMP/registries.conf"
          echo "CONTAINERS_REGISTRIES_CONF=$RUNNER_TEMP/registries.conf" >> "$GITHUB_ENV"

      - name: Build the image
        if: needs.changes.outputs.build == 'true'
        run: just build

      - name: Smoke test, the application imports under the compose restrictions
        if: needs.changes.outputs.build == 'true'
        run: just smoke-import

      - name: Smoke test, uid 10001 in the container
        if: needs.changes.outputs.build == 'true'
        run: just smoke-user

      # Podman-specific: the container's uid 10001 must not be root on the host
      - name: Smoke test, not root on the host
        if: needs.changes.outputs.build == 'true'
        run: |
          podman run -d --name probe $(just --evaluate hardened) "$IMAGE" python -c "import time; time.sleep(60)"
          podman top probe user huser
          test "$(podman top probe huser | tail -n 1)" != root
          podman rm -f probe

      - name: Smoke test, migrations apply to a named volume
        if: needs.changes.outputs.build == 'true'
        run: just smoke-migrate

  # Runs only on main and only after every check above has passed
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, tests, docker, podman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The vX.Y.Z tag created by this run, empty when nothing was released
      tag: ${{ steps.tag.outputs.tag }}
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      # Credentials stay: semantic-release pushes the release commit and the tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0 # all commits and tags are needed to compute the next version

      - name: Skip if main moved past the checked commit
        id: guard
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CHECKED_SHA" ]; then
            echo "main moved past $CHECKED_SHA; the newer push will be released." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.guard.outputs.skip != 'true'
        with:
          version: "0.9.16"

      - name: Validate release history
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/ci/validate_release_history.py

      # No release is created if there are no feat/fix/perf commits since the last tag
      - name: Version, changelog, tag and GitHub Release
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
          uvx --from python-semantic-release==10.7.0 semantic-release -v publish

      - name: Find the released tag
        id: tag
        if: steps.guard.outputs.skip != 'true'
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -1)" >> "$GITHUB_OUTPUT"

  # A separate job: a tag pushed with GITHUB_TOKEN does not start other workflows
  publish-image:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write      # append the image digest to the GitHub Release notes
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/university-match" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ needs.release.outputs.tag }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          # SBOM and full build provenance are attached to the image in the registry
          sbom: true
          provenance: mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Add the image to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ref="$IMAGE@$DIGEST"
          echo "Published \`$ref\` ($TAG)" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          {
            printf '\n### Docker image\n\n```bash\ndocker pull %s\n```\n\n' "$ref"
            printf 'Verify: `gh attestation verify oci://%s --owner %s`\n' "$ref" "$OWNER"
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
