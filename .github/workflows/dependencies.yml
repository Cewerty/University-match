name: Dependencies

# Reusable workflow: called by ci.yml after pyproject.toml is validated.
#   deptry     unused, missing and transitive dependencies (imports vs pyproject.toml)
#   pip-audit  known vulnerabilities in every locked package, dev group included; runs on every
#              change, unlike the Trivy scan of the image, which needs an image rebuild
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deptry:
    name: deptry
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.16"
          enable-cache: true

      - uses: ./.github/actions/setup-just

      # deptry maps imports to distributions, so everything must be installed
      - name: Install dependencies
        run: just sync

      - name: Check imports against pyproject.toml
        run: just deptry

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.16"

      - uses: ./.github/actions/setup-just

      # Works from uv.lock, nothing is installed
      - name: Audit the locked dependencies
        run: just audit
