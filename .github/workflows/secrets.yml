name: Secrets

# Reusable workflow: called by ci.yml. The gitleaks pre-commit hook only sees staged changes
# and `git commit --no-verify` skips it, so CI scans the whole history.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # every commit, not only the last one

      - uses: ./.github/actions/setup-just

      # gitleaks is built with the runner's Go at the version pinned in the justfile
      - name: Scan the git history
        run: just secrets
