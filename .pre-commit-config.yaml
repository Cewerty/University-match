# Install once: uv run pre-commit install
# (installs the pre-commit, commit-msg and pre-push hooks thanks to default_install_hook_types)
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14 # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Slower than the hooks above, so it runs before a push instead of on every commit
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: just typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
